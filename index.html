<!DOCTYPE html>
<html lang="fr-BE" data-i18n-title="title.home">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HomeService BXL</title>
<!-- arrivée d'une transition : l'écran est couvert dès le premier rendu (voir js/veil.js) -->
<!-- arrivée sur le site (pas d'une transition) : écran de chargement du site immersif, jusqu'à ce que la page soit prête -->
<script>try { var v = sessionStorage.getItem('hs-veil'); if (document.prerendering || v) { document.documentElement.classList.add('veil-in'); sessionStorage.removeItem('hs-veil'); } else document.documentElement.classList.add('loading'); } catch (e) { document.documentElement.classList.add('loading'); }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=28">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>

<header class="header" id="header">
  <div class="header__bar">
    <a href="#accueil" class="logo" aria-label="HomeService BXL, accueil" data-i18n-aria="home" aria-current="page"><img src="images/logo-blanc.png" alt="HomeService BXL" width="801" height="380"></a>
    <nav class="nav" aria-label="Navigation principale" data-i18n-aria="mainNav">
      <a href="#a-propos" data-i18n="nav.about">À propos</a>
      <a href="#services" data-i18n="nav.services">Services</a>
      <a href="#fonctionnement" data-i18n="nav.how">Fonctionnement</a>
      <a href="#zone" data-i18n="nav.zone">Zone</a>
      <a href="#contact" data-i18n="nav.contact">Contact</a>
    </nav>
    <div class="lang" id="lang">
      <button class="lang__btn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Langue"
        data-i18n-aria="langBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
        <span class="lang__code">FR</span>
        <svg class="lang__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
      </button>
      <ul class="lang__menu" role="listbox">
        <li><button type="button" role="option" data-lang="fr" lang="fr"><span>FR</span>Français</button></li>
        <li><button type="button" role="option" data-lang="en" lang="en"><span>EN</span>English</button></li>
        <li><button type="button" role="option" data-lang="nl" lang="nl"><span>NL</span>Nederlands</button></li>
      </ul>
    </div>
    <a href="#devis" class="header__cta" data-i18n="cta">Devis gratuit</a>
  </div>
</header>

<!-- Le site entier, sur une seule page qu'on fait défiler : accueil, à propos, services, fonctionnement, zone, contact,
     devis. La navbar mène à chaque section. -->
<main class="page page--hero" id="main">
  <!-- Accueil, puis À propos. Le hero reste en place (collant) le temps de la course : au fil du défilement, le vert
       monte du bas de l'écran et le remplit ; l'À propos arrive dessus, reste fixe le temps de ses apparitions, puis
       défile sur le vert (js/flood.js, qui règle les hauteurs de la course). -->
  <div class="hero-track">
  <section class="hero" aria-label="Accueil" data-i18n-aria="hero.label">
    <!-- l'îlot des services : scène 3D temps réel (js/hero.js, models/ilot.glb), on tourne autour à la souris -->
    <div class="hero__scene" id="hero-scene"></div>
    <!-- titre et description, repris de l'écran titre du site immersif (homeservice-immersive, .card) -->
    <div class="hero__text">
      <h1 data-i18n="hero.title">Besoin d'un coup<br>de main&nbsp;?</h1>
      <p data-i18n="hero.text">Ménage, désencombrement, montage de meubles, jardinage… On s'occupe de tout,
        <mark>à votre rythme</mark> et <mark>à votre budget</mark>.</p>
    </div>
    <!-- invitation à faire défiler, reprise du site immersif (homeservice-immersive, .scroll-hint) -->
    <div class="scroll-hint" aria-hidden="true">
      <span class="mouse"><span></span></span>
      <span data-i18n="hint">Faites défiler</span>
    </div>
  </section>
  <!-- À propos : posé sur le hero ; il reste fixe dans sa course (.about-track), puis défile -->
  <div class="about-track">
  <section class="about" aria-labelledby="a-propos-titre">
    <h2 class="sr-only" id="a-propos-titre" data-i18n="nav.about">À propos</h2>
    <div class="about__inner">
      <div class="about__text"></div>
      <figure class="about__photo">
        <img src="images/en-construction.png" alt="Site en construction" data-i18n-alt="about.photo" loading="lazy">
      </figure>
    </div>
  </section>
  </div>
  <!-- le vert reste fixe pendant que l'À propos s'en va et que la section suivante glisse dessus -->
  <div class="hero-tail" aria-hidden="true"></div>
  <!-- repères de la navbar dans la course du hero : l'accueil au début, l'À propos pendant qu'il est affiché (placés par js/flood.js) -->
  <div class="hero-mark hero-mark--home" id="accueil"></div>
  <div class="hero-mark hero-mark--about" id="a-propos"></div>
  </div>
</main>

<script src="js/veil.js?v=28"></script>
<script src="js/i18n.js?v=28"></script>
<script src="js/flood.js?v=28"></script>
<script type="module" src="js/hero.js?v=28"></script>
</body>
</html>
